<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0B0F0E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a1f1e;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#24C38C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2EE59D;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bgGradient)" />

    <!-- Decorative elements -->
    <circle cx="1000" cy="150" r="80" fill="#24C38C" opacity="0.1" filter="url(#glow)" />
    <circle cx="200" cy="500" r="120" fill="#2EE59D" opacity="0.08" filter="url(#glow)" />
    <circle cx="1100" cy="450" r="60" fill="#24C38C" opacity="0.12" filter="url(#glow)" />

    <!-- Main content area -->
    <g transform="translate(100, 150)">
        <!-- Foodly logo/brand -->
        <text x="0" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="72" font-weight="700" fill="white" letter-spacing="-0.02em">
            Foodly
        </text>

        <!-- Tagline -->
        <text x="0" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="36" font-weight="400" fill="#a3a3a3" letter-spacing="-0.01em">
            Find food that feels local
        </text>

        <!-- Accent line -->
        <rect x="0" y="170" width="120" height="4" fill="url(#accentGradient)" rx="2" />

        <!-- Description -->
        <text x="0" y="220" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="24" font-weight="400" fill="#71717a" line-height="1.4">
            A community-driven platform for discovering
        </text>
        <text x="0" y="250" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="24" font-weight="400" fill="#71717a">
            local food gems and hidden dining spots
        </text>

        <!-- Feature highlights -->
        <g transform="translate(0, 320)">
            <g transform="translate(0, 0)">
                <circle cx="15" cy="15" r="8" fill="url(#accentGradient)" />
                <text x="35" y="22"
                    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
                    font-size="18" font-weight="500" fill="white">Pin &amp; Discover Spots</text>
            </g>

            <g transform="translate(0, 50)">
                <circle cx="15" cy="15" r="8" fill="url(#accentGradient)" />
                <text x="35" y="22"
                    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
                    font-size="18" font-weight="500" fill="white">Community Recommendations</text>
            </g>

            <g transform="translate(0, 100)">
                <circle cx="15" cy="15" r="8" fill="url(#accentGradient)" />
                <text x="35" y="22"
                    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
                    font-size="18" font-weight="500" fill="white">Real Local Experiences</text>
            </g>
        </g>
    </g>

    <!-- Decorative compass/icon on the right -->
    <g transform="translate(900, 200)">
        <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accentGradient)" stroke-width="2"
            opacity="0.3" />
        <circle cx="0" cy="0" r="60" fill="none" stroke="url(#accentGradient)" stroke-width="1.5"
            opacity="0.2" />
        <circle cx="0" cy="0" r="40" fill="none" stroke="url(#accentGradient)" stroke-width="1"
            opacity="0.15" />

        <!-- Compass needle -->
        <g transform="rotate(45)">
            <polygon points="0,-25 3,-5 0,0 -3,-5" fill="#24C38C" opacity="0.8" />
            <polygon points="0,25 -3,5 0,0 3,5" fill="#2EE59D" opacity="0.8" />
        </g>

        <!-- Center dot -->
        <circle cx="0" cy="0" r="4" fill="white" />
    </g>

    <!-- Bottom accent -->
    <rect x="0" y="600" width="1200" height="30" fill="url(#accentGradient)" opacity="0.1" />
</svg>