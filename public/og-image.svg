<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0B0F0E;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0B0F0E;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#24C38C;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2EE59D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#24C38C;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bgGradient)" />

    <!-- Decorative elements -->
    <circle cx="200" cy="150" r="80" fill="#24C38C" opacity="0.1" filter="url(#glow)" />
    <circle cx="1000" cy="480" r="60" fill="#2EE59D" opacity="0.1" filter="url(#glow)" />
    <circle cx="1100" cy="200" r="40" fill="#24C38C" opacity="0.1" filter="url(#glow)" />

    <!-- Main logo/icon -->
    <g transform="translate(100, 200)">
        <!-- Map pin -->
        <path
            d="M50 0C22.3858 0 0 22.3858 0 50C0 70 50 120 50 120C50 120 100 70 100 50C100 22.3858 77.6142 0 50 0Z"
            fill="url(#textGradient)" filter="url(#glow)" />
        <circle cx="50" cy="50" r="20" fill="#0B0F0E" />

        <!-- Small accent pins -->
        <circle cx="20" cy="180" r="8" fill="#2EE59D" opacity="0.6" />
        <circle cx="80" cy="200" r="6" fill="#2EE59D" opacity="0.4" />
        <circle cx="10" cy="160" r="5" fill="#24C38C" opacity="0.5" />
    </g>

    <!-- Main text -->
    <g transform="translate(300, 200)">
        <!-- App name -->
        <text x="0" y="80" font-family="Arial, sans-serif" font-size="72" font-weight="bold"
            fill="url(#textGradient)" filter="url(#glow)">
            Foodly
        </text>

        <!-- Tagline -->
        <text x="0" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
            fill="#ffffff">
            Find food that feels local
        </text>

        <!-- Description -->
        <text x="0" y="200" font-family="Arial, sans-serif" font-size="24" font-weight="normal"
            fill="#a1a1aa" opacity="0.9">
            A community-driven platform for discovering local food gems
        </text>

        <!-- Features -->
        <g transform="translate(0, 250)">
            <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
                fill="#24C38C">
                Pin spots • Vouch favorites • Discover trends
            </text>
        </g>
    </g>

    <!-- Bottom accent -->
    <rect x="0" y="580" width="1200" height="50" fill="url(#textGradient)" opacity="0.1" />
</svg>