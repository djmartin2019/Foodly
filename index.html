<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>Foodly — Find food that feels local</title>
    <meta name="title" content="Foodly — Find food that feels local" />
    <meta
      name="description"
      content="A community-driven platform for discovering local food gems. Pin spots, vouch favorites, and discover trends powered by real people sharing authentic taste experiences."
    />
    <meta
      name="keywords"
      content="food discovery, local restaurants, food recommendations, community food app, hidden gems, local dining, food map, taste discovery"
    />
    <meta name="author" content="David Martin" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foodly.app/" />
    <meta property="og:title" content="Foodly — Find food that feels local" />
    <meta
      property="og:description"
      content="A community-driven platform for discovering local food gems. Pin spots, vouch favorites, and discover trends powered by real people sharing authentic taste experiences."
    />
    <meta property="og:image" content="https://foodly.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Foodly - Community-driven food discovery platform"
    />
    <meta property="og:site_name" content="Foodly" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://foodly.app/" />
    <meta
      property="twitter:title"
      content="Foodly — Find food that feels local"
    />
    <meta
      property="twitter:description"
      content="A community-driven platform for discovering local food gems. Pin spots, vouch favorites, and discover trends powered by real people sharing authentic taste experiences."
    />
    <meta property="twitter:image" content="https://foodly.app/og-image.png" />
    <meta
      property="twitter:image:alt"
      content="Foodly - Community-driven food discovery platform"
    />
    <meta property="twitter:creator" content="@foodlyapp" />
    <meta property="twitter:site" content="@foodlyapp" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#24C38C" />
    <meta name="msapplication-TileColor" content="#24C38C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Foodly" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://foodly.app/" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Foodly",
        "description": "A community-driven platform for discovering local food gems. Pin spots, vouch favorites, and discover trends powered by real people sharing authentic taste experiences.",
        "url": "https://foodly.app",
        "applicationCategory": "Food & Drink",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Person",
          "name": "David Martin",
          "email": "djmartindev@gmail.com"
        },
        "keywords": "food discovery, local restaurants, food recommendations, community food app, hidden gems, local dining, food map, taste discovery",
        "screenshot": "https://foodly.app/og-image.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
